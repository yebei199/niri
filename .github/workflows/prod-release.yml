name: Publish prod release tarball

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    # GitHub-hosted runners stopped starting jobs for this account on 2026-11-20; pc1 is the
    # self-hosted runner (nixos_config home/features/development/repo-runners.nix). The build uses
    # the flake's dev shell, whose libdisplay-info is 0.3 (soname .so.3), as nixos_config expects.
    runs-on: [self-hosted, pc1]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Build release
        run: nix develop --command cargo build --release --locked

      - name: Package release tarball
        id: package
        run: nix develop --command .github/scripts/package-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: prod-${{ steps.package.outputs.sha7 }}
        run: >-
          gh release create "$TAG" "${{ steps.package.outputs.tarball_path }}"
          --repo "${{ github.repository }}" --target "${{ github.sha }}"
          --title "$TAG" --notes-file "${{ steps.package.outputs.notes_path }}"
